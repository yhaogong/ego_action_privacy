[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-action-privacy"
version = "0.1.0"
description = "Adversarial action-privacy protection for egocentric video"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
internvideo = [
  "accelerate==0.34.2",
  "peft==0.13.2",
  "sentencepiece>=0.2",
  "transformers==4.45.2",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

paths:
  data_root: /data2/yhao/datasets/egoexo4d
  output_root: /data2/yhao/outputs/ego_action_privacy
  manifest_dir: /data2/yhao/outputs/ego_action_privacy/official_278/manifests
  train_manifest: /data2/yhao/outputs/ego_action_privacy/official_278/manifests/keystep_train.json
  val_manifest: /data2/yhao/outputs/ego_action_privacy/official_278/manifests/keystep_val.json
  class_map: /data2/yhao/outputs/ego_action_privacy/official_278/manifests/class_map.json
  model_dir: /data2/yhao/models/InternVideo2-CLIP-1B
  text_cache: /data2/yhao/outputs/ego_action_privacy/official_278/cache/keystep_278_text_features.pt
  recognizer_checkpoint: /data2/yhao/outputs/ego_action_privacy/official_278/runs/internvideo2_278_supervised/checkpoint_best.pt

data:
  num_frames: 8
  image_size: 224
  batch_size: 1
  num_workers: 4
  # Formal runs refuse missing videos. CLI --allow-partial-data is required for smoke runs.
  allow_partial_data: false

target:
  kind: supervised
  name: InternVideo2-CLIP-1B-224p-f8-supervised-278
  dtype: bfloat16
  gradient_checkpointing: true

generator:
  temporal_mode: 3d
  base_channels: 32
  epsilon_255: 8.0

loss:
  attack: 1.0
  pixel: 0.05
  magnitude: 0.05
  temporal: 0.1
  spatial_tv: 0.0
  margin: 0.0

train:
  seed: 0
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.00001
  log_every: 10
  checkpoint_every: 500
  max_steps: null

evaluation:
  seed: 0
  random_noise_seed: 20261015
  example_videos: 4
